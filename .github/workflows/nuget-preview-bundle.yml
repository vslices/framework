name: Verify VSlices NuGet preview bundle

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/verify-nuget-packages.py'
      - '.github/workflows/nuget-preview-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack all eleven public libraries (no push)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          for project in \
            VSlices \
            VSlices.Spaces \
            VSlices.Work \
            VSlices.Work.DataAccess \
            VSlices.Extensions.EFCore \
            VSlices.Grounding \
            VSlices.Grounding.DataAccess.EFCore \
            VSlices.Views.Abstract \
            VSlices.Spaces.Authentication \
            VSlices.Work.Authentication \
            VSlices.Grounding.Authentication.AspNetCore
          do
            dotnet pack "src/${project}/${project}.csproj" -c Release -o artifacts/nuget
          done
      - name: Resolve coordinated version from MSBuild
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(dotnet msbuild src/VSlices/VSlices.csproj -getProperty:Version | tail -n 1 | tr -d '\r')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify package IDs, dependencies, and excluded analyzers
        run: python3 scripts/verify-nuget-packages.py artifacts/nuget "${{ steps.version.outputs.version }}"
      - name: Upload package bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: vslices-nuget-preview-${{ steps.version.outputs.version }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
