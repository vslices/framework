name: Functional EF Core integration

on:
  pull_request:
    paths:
      - 'src/VSlices.Grounding.EntityFrameworkCore.Functional/**'
      - 'tests/VSlices.Grounding.EntityFrameworkCore.Functional.Tests/**'
      - '.github/workflows/functional-ef-core.yml'
      - 'VSlices.slnx'
  push:
    branches: [master]
    paths:
      - 'src/VSlices.Grounding.EntityFrameworkCore.Functional/**'
      - 'tests/VSlices.Grounding.EntityFrameworkCore.Functional.Tests/**'
      - '.github/workflows/functional-ef-core.yml'
      - 'VSlices.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Docker availability
        run: docker info
      - name: Restore
        run: dotnet restore tests/VSlices.Grounding.EntityFrameworkCore.Functional.Tests/VSlices.Grounding.EntityFrameworkCore.Functional.Tests.csproj
      - name: PostgreSQL / Testcontainers integration
        run: dotnet run --project tests/VSlices.Grounding.EntityFrameworkCore.Functional.Tests/VSlices.Grounding.EntityFrameworkCore.Functional.Tests.csproj -c Release --no-restore
      - name: Pack functional EF Core
        run: dotnet pack src/VSlices.Grounding.EntityFrameworkCore.Functional/VSlices.Grounding.EntityFrameworkCore.Functional.csproj -c Release -o artifacts/nuget --no-restore
