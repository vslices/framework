name: UpdateTodo Optimization Depth

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-todo-optimization-depth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.head_ref == 'experiment/update-todo-optimization-depth' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run semantic equivalence tests
        run: dotnet run --project examples/SampleWorkflow/SampleWorkflow.Process.Tests/SampleWorkflow.Process.Tests.csproj

      - name: Run optimization probe
        run: dotnet run -c Release --project examples/SampleWorkflow/SampleWorkflow.OptimizationProbe/SampleWorkflow.OptimizationProbe.csproj
