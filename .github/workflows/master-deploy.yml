name: Publish VSlices NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: vslices-nuget-publish
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate release tag
        id: validate
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v?0\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "::error::Invalid preview tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-test-pack:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit to be on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore VSlices.slnx
      - name: Build solution
        run: dotnet build VSlices.slnx -c Release --no-restore
      - name: Test solution (VSTest and xUnit v3)
        shell: bash
        run: |
          set -euo pipefail

          # xUnit v2 suites use the VSTest runner.
          for project in \
            tests/VSlices.Spaces.Tests/VSlices.Spaces.Tests.csproj \
            tests/VSlices.Spaces.Modeling.Tests/VSlices.Spaces.Modeling.Tests.csproj
          do
            dotnet test "$project" -c Release --no-build --no-restore
          done

          # xUnit v3 suites are executable test projects; run their entrypoints
          # directly instead of routing them through the legacy VSTest target.
          for project in \
            examples/SampleBFF/SampleBFF.Tests/SampleBFF.Tests.csproj \
            examples/SampleWorkflow/SampleWorkflow.Process.Tests/SampleWorkflow.Process.Tests.csproj \
            tests/VSlices.Extensions.EFCore.Tests/VSlices.Extensions.EFCore.Tests.csproj \
            tests/VSlices.Grounding.DataAccess.EFCore.Tests/VSlices.Grounding.DataAccess.EFCore.Tests.csproj \
            tests/VSlices.Grounding.Tests/VSlices.Grounding.Tests.csproj \
            tests/VSlices.Spaces.Analyzers.Tests/VSlices.Spaces.Analyzers.Tests.csproj \
            tests/VSlices.Views.Abstract.Tests/VSlices.Views.Abstract.Tests.csproj \
            tests/VSlices.Work.Algebra.Tests/VSlices.Work.Algebra.Tests.csproj
          do
            dotnet run --project "$project" -c Release --no-build --no-restore
          done
      - name: Pack all eleven libraries
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          for project in VSlices VSlices.Spaces VSlices.Work VSlices.Work.DataAccess VSlices.Extensions.EFCore VSlices.Grounding VSlices.Grounding.DataAccess.EFCore VSlices.Views.Abstract VSlices.Spaces.Authentication VSlices.Work.Authentication VSlices.Grounding.Authentication.AspNetCore; do
            dotnet pack "src/${project}/${project}.csproj" -c Release --no-restore --no-build -p:Version="$VERSION" -o artifacts/nuget
          done
      - name: Verify package manifests and analyzer exclusion
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: python3 scripts/verify-nuget-packages.py artifacts/nuget "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: vslices-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  publish:
    needs: build-test-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vslices-nuget
          path: artifacts/nuget
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Acquire NuGet.org key using GitHub OIDC
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY"
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
