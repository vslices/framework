name: Publish VSlices NuGet

on:
  push:
    branches:
      - recovery/publish-v0.1.0-preview.1

permissions:
  contents: read

concurrency:
  group: vslices-nuget-publish
  cancel-in-progress: false

jobs:
  build-test-pack:
    if: github.ref == 'refs/heads/recovery/publish-v0.1.0-preview.1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0-preview.1
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit to be on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify exact release source
        run: |
          test "$(git rev-parse HEAD)" = "d76be8c5cd94b3b2bc64a45bf67668bd5684a32d"
          grep -q '<Version>0.1.0-preview.1</Version>' src/Directory.Build.props
      - name: Restore solution
        run: dotnet restore VSlices.slnx
      - name: Build solution
        run: dotnet build VSlices.slnx -c Release --no-restore
      - name: Test solution (VSTest and xUnit v3)
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/VSlices.Spaces.Tests/VSlices.Spaces.Tests.csproj \
            tests/VSlices.Spaces.Modeling.Tests/VSlices.Spaces.Modeling.Tests.csproj
          do
            dotnet test "$project" -c Release --no-build --no-restore
          done
          for project in \
            examples/SampleBFF/SampleBFF.Tests/SampleBFF.Tests.csproj \
            examples/SampleWorkflow/SampleWorkflow.Process.Tests/SampleWorkflow.Process.Tests.csproj \
            tests/VSlices.Grounding.EntityFrameworkCore.Tests/VSlices.Grounding.EntityFrameworkCore.Tests.csproj \
            tests/VSlices.Grounding.Tests/VSlices.Grounding.Tests.csproj \
            tests/VSlices.Spaces.Analyzers.Tests/VSlices.Spaces.Analyzers.Tests.csproj \
            tests/VSlices.Views.Abstract.Tests/VSlices.Views.Abstract.Tests.csproj \
            tests/VSlices.Work.Algebra.Tests/VSlices.Work.Algebra.Tests.csproj
          do
            dotnet run --project "$project" -c Release --no-build --no-restore
          done
      - name: Pack all ten libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          for project in VSlices VSlices.Spaces VSlices.Spaces.Services VSlices.Spaces.Products VSlices.Work VSlices.Work.Services VSlices.Work.Products VSlices.Grounding VSlices.Grounding.EntityFrameworkCore VSlices.Views.Abstract; do
            dotnet pack "src/${project}/${project}.csproj" -c Release --no-restore --no-build -p:Version=0.1.0-preview.1 -o artifacts/nuget
          done
      - name: Verify package manifests and analyzer exclusion
        run: python3 scripts/verify-nuget-packages.py artifacts/nuget
      - uses: actions/upload-artifact@v4
        with:
          name: vslices-nuget-0.1.0-preview.1
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  publish:
    needs: build-test-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vslices-nuget-0.1.0-preview.1
          path: artifacts/nuget
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Acquire NuGet.org key using GitHub OIDC
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY"
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
